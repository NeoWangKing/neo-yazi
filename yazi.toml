# yazi.toml
[mgr]
show_hidden = true
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_symlink = true
scrolloff = 10

[preview]
wrap = "no"

[opener]
edit = [{ run = 'nvim %s', block = true, desc = "编辑" }]

pdf = [
    { run = 'evince %s',      orphan = true, for = "linux", desc = "Evince" },
    { run = 'open -a Skim %s', orphan = true, for = "macos", desc = "Skim" },
]

img = [
    { run = 'feh %s', orphan = true, for = "linux", desc = "feh" },
    { run = 'open %s', orphan = true, for = "macos", desc = "Preview" },
]

video = [
    { run = 'vlc %s',          orphan = true, for = "linux", desc = "VLC" },
    { run = 'open -a VLC %s',  orphan = true, for = "macos", desc = "VLC" },
]

[open]
prepend_rules = [
{ url = "*.pdf",  use = "pdf" },
{ url = "*.png",  use = "img" },
{ url = "*.jpg",  use = "img" },
{ url = "*.jpeg", use = "img" },
{ url = "*.gif",  use = "img" },
{ url = "*.bmp",  use = "img" },
{ url = "*.webp", use = "img" },
{ url = "*.svg",  use = "img" },
{ url = "*.tiff", use = "img" },
{ url = "*.ico",  use = "img" },
{ url = "*.heic", use = "img" },
{ url = "*.avif", use = "img" },
# 视频文件扩展名匹配
{ url = "*.mp4",  use = "video" },
{ url = "*.mkv",  use = "video" },
{ url = "*.avi",  use = "video" },
{ url = "*.mov",  use = "video" },
{ url = "*.flv",  use = "video" },
{ url = "*.webm", use = "video" },
{ url = "*.m4v",  use = "video" },
{ url = "*.mpg",  use = "video" },
{ url = "*.mpeg", use = "video" },
{ url = "*.wmv",  use = "video" },
{ url = "*.3gp",  use = "video" },
	]

